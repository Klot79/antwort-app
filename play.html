<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antwort! – Unterricht</title>
<style>
:root{--nav:#182238;--bg:#f3f5fa;--card:#fff;--line:#dce3ee;--ink:#182238;--muted:#69758b;--green:#18a56d;--blue:#1683ee;--red:#df5353;--purple:#6945ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:var(--nav);color:#fff;padding:13px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}.brand{font-size:24px;font-weight:950}.spacer{flex:1}.room{background:#2b3850;border-radius:12px;padding:9px 12px;font-weight:950}.wrap{max-width:1250px;margin:auto;padding:18px 14px 105px}.connect{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.code{font-size:26px;font-weight:950;letter-spacing:.18em;color:var(--blue)}.status{color:var(--muted);font-weight:800}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.phase{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:950}.q{font-size:clamp(30px,4.2vw,54px);font-weight:950;line-height:1.08;margin:10px 0 22px;overflow-wrap:anywhere}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:15px;border-radius:15px;background:#f1f3f7;font-size:18px;font-weight:850;min-height:75px}.opt b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#fff;margin-right:8px}.countBox{display:flex;align-items:center;justify-content:space-between;background:#eef5ff;border-radius:17px;padding:15px;margin-bottom:14px}.countBox .n{font-size:44px;font-weight:950;color:var(--blue)}.live{display:grid;gap:7px;max-height:500px;overflow:auto}.student{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:10px;border-radius:13px;background:#f8f9fc;border:1px solid var(--line)}.student .emoji{font-size:27px}.student .name{font-weight:900}.answer{font-weight:950}.good{color:var(--green)}.bad{color:var(--red)}.empty{text-align:center;padding:24px;color:var(--muted);font-weight:800}.controls{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px;display:flex;justify-content:center;gap:8px;z-index:30}.controls button{border:0;border-radius:13px;padding:13px 16px;font-weight:950;color:#fff}.start{background:var(--green)}.stop{background:var(--red)}.next{background:var(--purple)}.display{background:#26344b}.openScan{background:var(--blue)}.feedback{position:fixed;inset:0;display:none;place-items:center;z-index:60;pointer-events:none}.feedback.show{display:grid;animation:pop .7s ease}.feedback span{width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:90px;box-shadow:0 20px 70px #0006}@keyframes pop{0%{opacity:0;transform:scale(.5)}30%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}button:disabled{opacity:.35;cursor:not-allowed}@media(max-width:800px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.controls{flex-wrap:wrap}}
</style></head><body>
<div class="top"><div class="brand">🎮 Antwort! · Unterricht</div><div class="spacer"></div><div class="room">Raum <span id="roomCode">–</span></div></div>
<div class="wrap"><div class="connect"><strong>📱 iPhone verbinden:</strong><span class="code" id="code">–</span><span class="status" id="connStatus">Scanner-Seite öffnen und den Code eingeben.</span></div>
<div class="grid"><section class="card" id="questionCard"></section><aside class="card"><div class="countBox"><div><div style="font-weight:950">📷 Karten gescannt</div><div class="status">Antworten dieser Frage</div></div><div class="n" id="count">0</div></div><h3 style="margin:8px 0 10px">Live-Rückmeldung</h3><div id="live" class="live"><div class="empty">Noch keine Karten erkannt.</div></div></aside></div></div>
<div class="controls"><button class="start" id="start">▶ Frage starten</button><button class="stop" id="stop">■ Scannen stoppen</button><button class="next" id="next">Weiter →</button><button class="display" id="display">🖥️ Display</button><button class="openScan" id="openScan">📱 Scanner-Seite</button></div>
<div id="feedback" class="feedback"><span id="feedbackIcon"></span></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const KEY='antwort-v4-state',$=id=>document.getElementById(id);let peer=null,connections=new Set(),feedbackTimer=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function current(s){return s?.questions?.find(q=>q.id===s.currentQuestion)}
function room(){const r=(new URLSearchParams(location.search).get('room')||'').trim().toUpperCase();return /^[A-Z0-9]{5}$/.test(r)?r:''}
const ROOM=room();
if(!ROOM){document.body.innerHTML='<div style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:40px;text-align:center"><h2>Kein Unterrichtsraum</h2><p>Bitte den Unterricht aus dem Administrator starten.</p></div>';throw new Error('Missing room code');}$('roomCode').textContent=ROOM;$('code').textContent=ROOM;
function feedback(ok){clearTimeout(feedbackTimer);$('feedbackIcon').textContent=ok?'👍':'❗';$('feedback').className='feedback show';feedbackTimer=setTimeout(()=>$('feedback').className='feedback',700)}
function render(){const s=get(),q=current(s),a=Object.values(s?.answers||{});$('count').textContent=a.length;if(!s||!q){$('questionCard').innerHTML='<div class="phase">BEREIT</div><div class="q">Keine Fragen vorhanden</div><div class="status">Gehe zurück in den Administrator und erstelle Fragen.</div>';renderLive([]);return}if(s.phase==='results'){const good=a.filter(x=>x.correct).length;$('questionCard').innerHTML=`<div class="phase">ERGEBNIS · FRAGE ${(s.currentIndex??0)+1}</div><div class="q">${good} von ${a.length} richtig</div><div class="opts">${q.options.map((o,i)=>`<div class="opt"><b>${'ABCD'[i]}</b>${esc(o)}</div>`).join('')}</div><div class="status" style="margin-top:12px">Du kannst jetzt zur nächsten Frage wechseln.</div>`}else if(s.phase==='finished')$('questionCard').innerHTML='<div class="phase">FERTIG</div><div class="q">Unterrichtsrunde beendet 🎉</div><div class="status">Ergebnisse bleiben in den Statistiken gespeichert.</div>';else if(s.phase==='idle')$('questionCard').innerHTML=`<div class="phase">FRAGE ${(s.currentIndex??0)+1} / ${s.questions.length}</div><div class="q">Bereit?</div><div class="status">Drücke „Frage starten“. Dann beginnt das Scannen.</div>`;else $('questionCard').innerHTML=`<div class="phase">FRAGE ${(s.currentIndex??0)+1} / ${s.questions.length}</div><div class="q">${esc(q.text)}</div><div class="opts">${q.options.map((o,i)=>`<div class="opt"><b>${'ABCD'[i]}</b>${esc(o)}</div>`).join('')}</div><div class="status" style="margin-top:12px">Scannen läuft. Du kannst jederzeit stoppen.</div>`;renderLive(a);$('start').disabled=s.phase==='question'||s.phase==='finished';$('stop').disabled=s.phase!=='question';$('next').disabled=s.phase!=='results'}
function renderLive(a){const s=get();if(!a.length){$('live').innerHTML='<div class="empty">Noch keine Karten erkannt.</div>';return}$('live').innerHTML=a.map(x=>{const st=s.students.find(y=>y.id===x.id)||{};return `<div class="student"><div class="emoji">${esc(st.emoji||'👤')}</div><div><div class="name">${esc(st.name||x.id)}</div><div class="status">Antwort ${'ABCD'[x.answer]||'?'}</div></div><div class="answer ${x.correct?'good':'bad'}">${x.correct?'👍':'❗'}</div></div>`}).join('')}
function broadcast(){for(const c of [...connections]){try{if(c.open)c.send({type:'state',state:get()});else connections.delete(c)}catch{connections.delete(c)}}}
function connectPeer(){peer?.destroy();peer=new Peer('antwort-A'+ROOM,{debug:0});peer.on('open',()=>{$('connStatus').textContent='Warte auf iPhone oder Display …'});peer.on('connection',c=>{connections.add(c);c.on('open',()=>{c.send({type:'state',state:get()});broadcast();$('connStatus').textContent='✅ Gerät verbunden'});c.on('data',msg=>{if(msg?.type==='hello')broadcast();if(msg?.type==='scan')receive(msg)});c.on('close',()=>{connections.delete(c);$('connStatus').textContent=connections.size?'✅ Gerät verbunden':'Warte auf iPhone oder Display …'});c.on('error',()=>connections.delete(c))});peer.on('error',e=>$('connStatus').textContent='❗ Verbindung nicht möglich. Prüfe Internetverbindung und öffne Scanner/Display erneut.')}

function receive(msg){const s=get();if(!s||s.phase!=='question')return;const q=current(s),st=s.students?.find(x=>x.id===msg.studentId);if(!q||!st)return;if(s.answers?.[st.id])return;const answer=Number(msg.answer);if(![0,1,2,3].includes(answer))return;s.answers=s.answers||{};s.answers[st.id]={id:st.id,answer,correct:answer===Number(q.correct),at:Date.now()};save(s);feedback(answer===Number(q.correct));broadcast()}
function start(){const s=get();if(!s?.questions?.length)return;s.currentQuestion=s.questions[s.currentIndex??0].id;s.answers={};s.phase='question';save(s);broadcast()}
function stop(){const s=get();if(!s||s.phase!=='question')return;const q=current(s),a=Object.values(s.answers||{});s.history=s.history||[];s.history.push({questionId:q.id,total:a.length,correct:a.filter(x=>x.correct).length,rows:a.map(x=>({id:x.id,answer:x.answer,correct:x.correct}))});s.phase='results';save(s);broadcast()}
function next(){const s=get();if(!s||s.phase!=='results')return;const i=(s.currentIndex??0)+1;if(i>=s.questions.length){s.phase='finished'}else{s.currentIndex=i;s.currentQuestion=s.questions[i].id;s.answers={};s.phase='idle'}save(s);broadcast()}
$('start').onclick=start;$('stop').onclick=stop;$('next').onclick=next;$('display').onclick=()=>window.open('display.html?room='+encodeURIComponent(ROOM),'antwort-display');$('openScan').onclick=()=>window.open('scan.html','antwort-scan');window.addEventListener('storage',render);connectPeer();render();
</script></body></html>
