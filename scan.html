<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Antwort! – iPhone Scanner</title>
<style>:root{--bg:#101827;--card:#1b273b;--muted:#aeb8c9;--blue:#2589ef;--red:#e55353}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;padding:16px;display:flex;flex-direction:column}.head{display:flex;align-items:center}.logo{font-size:24px;font-weight:950}.spacer{flex:1}.pill{background:#26344b;border-radius:12px;padding:9px 11px;font-weight:950}.card{margin:auto 0;background:var(--card);border-radius:22px;padding:18px}.label{color:var(--muted);font-size:13px;font-weight:950;letter-spacing:.1em}.input{width:100%;margin:10px 0;padding:15px;border-radius:13px;border:0;font-size:22px;font-weight:900;text-transform:uppercase}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:950;color:#fff;background:var(--blue)}.status{color:var(--muted);font-weight:800;margin-top:10px}.camera{display:none;position:fixed;inset:0;background:#050910;z-index:20;padding:10px}.camera.open{display:flex;flex-direction:column}.camhead{display:flex;align-items:center;gap:10px;padding:5px}.camhead .spacer{flex:1}.stop{background:var(--red);border:0;color:#fff;border-radius:12px;padding:10px;font-weight:950}.view{position:relative;flex:1;overflow:hidden;border-radius:18px;background:#000}.view video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;width:min(82vw,520px);height:min(54vw,350px);border:3px solid #fff9;border-radius:20px;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 9999px #0002}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 14px;border-radius:12px;font-weight:850;white-space:nowrap}.feedback{position:fixed;inset:0;z-index:40;display:none;place-items:center;pointer-events:none}.feedback.show{display:grid;animation:pop .6s ease}.feedback span{width:145px;height:145px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:88px}@keyframes pop{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
</style></head><body><div class="wrap"><div class="head"><div class="logo">📱 Antwort! Scanner</div><div class="spacer"></div><div class="pill">Karten: <span id="count">0</span></div></div><div class="card"><div class="label">MIT DEM LEHRER VERBINDEN</div><div style="font-size:21px;font-weight:950;margin:8px 0">Raumcode eingeben</div><input id="room" class="input" maxlength="5" placeholder="z. B. 7K3P2"><button id="join" class="btn">🔗 Verbinden</button><div id="status" class="status">Öffne am MacBook zuerst „Unterricht starten“. Gib dann den dort angezeigten Raumcode ein.</div></div></div>
<div id="camera" class="camera"><div class="camhead"><b>📷 Scannen</b><span id="camstatus" class="status">läuft …</span><div class="spacer"></div><button id="stop" class="stop">Stop</button></div><div class="view"><video id="video" playsinline muted></video><div class="guide"></div><div class="hint">Karte vollständig ins Feld halten</div></div></div><div id="feedback" class="feedback"><span id="icon"></span></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const $=id=>document.getElementById(id);let peer=null,conn=null,stream=null,raf=null,last=new Map(),feedbackTimer=null,currentState=null;
function feedback(ok){clearTimeout(feedbackTimer);$('icon').textContent=ok?'👍':'❗';$('feedback').className='feedback show';feedbackTimer=setTimeout(()=>$('feedback').className='feedback',650)}function showCount(){$('count').textContent=Object.keys(currentState?.answers||{}).length}
function join(){const code=$('room').value.trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(code)){alert('Bitte den fünfstelligen Raumcode eingeben.');return}$('status').textContent='⏳ Verbinde …';peer?.destroy();peer=new Peer(undefined,{debug:0});peer.on('open',()=>{conn=peer.connect('antwort-A'+code,{reliable:true});conn.on('open',()=>{$('status').textContent='✅ Verbunden. Bereit zum Scannen.';conn.send({type:'hello'})});conn.on('data',onData);conn.on('close',()=>{$('status').textContent='Verbindung zum MacBook getrennt.';stopCamera()})});peer.on('error',()=>{$('status').textContent='❗ Verbindung fehlgeschlagen. Code prüfen und erneut versuchen.'})}
function onData(msg){if(msg?.type!=='state')return;currentState=msg.state;showCount();if(currentState.phase==='question'&&!stream)startCamera()}
function stopCamera(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('camera').classList.remove('open')}
function angle(loc){const dx=loc.topRightCorner.x-loc.topLeftCorner.x,dy=loc.topRightCorner.y-loc.topLeftCorner.y,d=(Math.atan2(dy,dx)*180/Math.PI+360)%360;return d<45||d>=315?0:d<135?1:d<225?2:3}
function sendScan(f){const m=/^ANTWORT:(E\d\d)$/.exec(f.data);if(!m||!conn||!currentState||currentState.phase!=='question')return;if(currentState.answers?.[m[1]])return;const a=angle(f.location);conn.send({type:'scan',studentId:m[1],answer:a});last.set(m[1],Date.now());const q=currentState.questions?.find(x=>x.id===currentState.currentQuestion);if(q)feedback(a===Number(q.correct))}
function loop(){if(!stream)return;const v=$('video'),c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});if(v.readyState>=2&&window.jsQR){c.width=v.videoWidth;c.height=v.videoHeight;if(c.width&&c.height){ctx.drawImage(v,0,0,c.width,c.height);const im=ctx.getImageData(0,0,c.width,c.height),f=jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});if(f){const m=/^ANTWORT:(E\d\d)$/.exec(f.data),n=Date.now();if(m&&(!last.has(m[1])||n-last.get(m[1])>1000))sendScan(f)}}}raf=requestAnimationFrame(loop)}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Dieser Browser unterstützt keine Kamera.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();$('camera').classList.add('open');last.clear();loop()}catch(e){$('status').textContent='Kamera konnte nicht gestartet werden: '+e.message}}
$('join').onclick=join;$('stop').onclick=stopCamera;$('room').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
</script></body></html>
