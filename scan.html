<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Antwort! – Handy Scanner</title>
<style>
:root{--bg:#101827;--card:#1b273b;--muted:#aeb8c9;--green:#18b879;--blue:#2589ef;--red:#e55353}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{min-height:100vh;padding:16px;display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:10px}.logo{font-size:24px;font-weight:950}.spacer{flex:1}.pill{background:#26344b;border-radius:12px;padding:9px 11px;font-weight:950}.card{margin:auto 0;background:var(--card);border-radius:22px;padding:18px}.label{color:var(--muted);font-size:13px;font-weight:950;letter-spacing:.1em}.code{font-size:25px;font-weight:950;letter-spacing:.15em}.input{width:100%;margin:10px 0;padding:15px;border-radius:13px;border:0;font-size:22px;font-weight:900;text-transform:uppercase}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:950;color:#fff;background:var(--blue)}.status{color:var(--muted);font-weight:800;margin-top:10px}.camera{display:none;position:fixed;inset:0;background:#050910;z-index:20;padding:10px}.camera.open{display:flex;flex-direction:column}.camhead{display:flex;align-items:center;gap:10px;padding:5px}.camhead .spacer{flex:1}.stop{background:#e55353;border:0;color:#fff;border-radius:12px;padding:10px;font-weight:950}.view{position:relative;flex:1;overflow:hidden;border-radius:18px;background:#000}.view video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;width:min(80vw,520px);height:min(52vw,340px);border:3px solid #fff9;border-radius:20px;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 9999px #0002}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 14px;border-radius:12px;font-weight:850;white-space:nowrap}
.feedback{position:fixed;inset:0;z-index:40;display:none;place-items:center;pointer-events:none}.feedback.show{display:grid;animation:pop .6s ease}.feedback span{width:145px;height:145px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:88px}@keyframes pop{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
</style>
</head>
<body>
<div class="wrap">
 <div class="head"><div class="logo">📱 Antwort! Scanner</div><div class="spacer"></div><div class="pill">Karten: <span id="count">0</span></div></div>
 <div class="card">
  <div class="label">📱 BEREIT</div>
  <div style="font-size:22px;font-weight:950;margin:8px 0">Mit dem Display verbunden</div>
  <button class="btn" id="join">Scanner starten</button>
  <div id="status" class="status">Der feste QR-Code auf dem Display verbindet automatisch mit dem Lehrer-Mac.</div>
 </div>
</div>
<div id="camera" class="camera"><div class="camhead"><b>📷 Scannen</b><span id="camstatus" class="status">läuft …</span><div class="spacer"></div><button id="stop" class="stop">Stop</button></div><div class="view"><video id="video" playsinline muted></video><div class="guide"></div><div class="hint">Karte vollständig ins Feld halten</div></div></div>
<div id="feedback" class="feedback"><span id="icon"></span></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $=id=>document.getElementById(id);let peer=null,conn=null,stream=null,raf=null,last=new Map(),timer=null,currentState=null;const FIXED_ROOM='K7P3Q';
function feedback(ok){clearTimeout(timer);$('icon').textContent=ok?'👍':'❗';$('feedback').className='feedback show';timer=setTimeout(()=>$('feedback').className='feedback',600)}
function showCount(){let a=Object.values(currentState?.answers||{});$('count').textContent=a.length}
function join(){let code=FIXED_ROOM;$('status').textContent='Verbinde mit dem Lehrer …';peer?.destroy();peer=new Peer(undefined,{debug:0});peer.on('open',()=>{conn=peer.connect('antwort-A'+code,{reliable:true});conn.on('open',()=>{ $('status').textContent='✅ Verbunden. Bereit zum Scannen.';conn.send({type:'hello'}); });conn.on('data',onData);conn.on('close',()=>{$('status').textContent='Verbindung zum MacBook getrennt.';stopCamera()})});peer.on('error',e=>$('status').textContent='Verbindung fehlgeschlagen. Bitte QR-Code erneut scannen.');}
function onData(msg){if(msg?.type==='state'){currentState=msg.state;showCount();if(currentState.phase==='question'&&!stream)startCamera()}}
function stopCamera(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('camera').classList.remove('open')}
function sendScan(f){
 let m=/^ANTWORT:(E\d\d)$/.exec(f.data);if(!m||!conn||!currentState)return;
 let s=currentState;if(s.phase!=='question')return;
 if(s.answers?.[m[1]])return;
 let dx=f.location.topRightCorner.x-f.location.topLeftCorner.x,dy=f.location.topRightCorner.y-f.location.topLeftCorner.y,deg=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
 let answer=deg<45||deg>=315?0:deg<135?1:deg<225?2:3;
 conn.send({type:'scan',studentId:m[1],answer});last.set(m[1],Date.now());
 // Feedback on the phone is based on the current question immediately.
 let q=s.questions?.find(x=>x.id===s.currentQuestion);if(q)feedback(answer===Number(q.correct));
}
function loop(){if(!stream)return;let v=$('video'),c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});if(v.readyState>=2&&window.jsQR){c.width=v.videoWidth;c.height=v.videoHeight;if(c.width&&c.height){ctx.drawImage(v,0,0,c.width,c.height);let im=ctx.getImageData(0,0,c.width,c.height),f=jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});if(f){let m=/^ANTWORT:(E\d\d)$/.exec(f.data),n=Date.now();if(m&&(!last.has(m[1])||n-last.get(m[1])>900)){sendScan(f)}}}}raf=requestAnimationFrame(loop)}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Dieser Browser unterstützt keine Kamera.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();$('camera').classList.add('open');$('camstatus').textContent='Scan läuft dauerhaft';last.clear();loop()}catch(e){$('status').textContent='Kamera konnte nicht gestartet werden: '+e.message}}
$('join').onclick=join;$('stop').onclick=stopCamera;window.addEventListener('load',()=>{if(new URLSearchParams(location.search).get('raum')===FIXED_ROOM)join()});
</script></body></html>
