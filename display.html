<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d17"><title>Antwort! – Präsentation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090d17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.screen{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:5vw;text-align:center}.tag{opacity:.6;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px}.q{font-size:clamp(30px,5vw,72px);font-weight:950;max-width:1400px;line-height:1.08;margin:20px auto}.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(1200px,90vw)}.opt{padding:18px 22px;border:2px solid #39435a;border-radius:18px;font-size:clamp(18px,2.5vw,34px);font-weight:800}.reveal{color:#61e2ac;font-size:clamp(30px,5vw,65px);font-weight:950;margin-top:22px}.hint{position:fixed;bottom:18px;opacity:.35;font-size:13px}.controls{position:fixed;right:15px;top:15px;display:flex;gap:7px}.controls button{background:#20283a;color:#fff;border:0;border-radius:11px;padding:9px 12px;font-weight:850}.controls button:hover{background:#303b53}.hidden{display:none!important}@media(max-width:700px){.opts{grid-template-columns:1fr}}
</style></head>
<body>
<div class="controls"><button id="full">⛶ Vollbild</button><button id="hide">Steuerung ausblenden</button></div>
<main class="screen"><div class="tag">Antwort! · Klassenquiz</div><div id="questionLabel" style="opacity:.45;font-size:13px;font-weight:800;margin-top:10px">FRAGE</div><div id="content"><div class="q">Warte auf eine Frage …</div><div class="hint">Auf dem Lehrergerät eine Frage starten.</div></div></main>
<script>
const KEY='antwort-v1-state';
let last='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){s=null}
 const q=s?.questions?.find(x=>x.id===s.currentQuestion);
 const content=document.getElementById('content');
 if(!q){content.innerHTML='<div class="q">Warte auf eine Frage …</div>';return}
 let reveal=s?.revealAnswer;
 content.innerHTML=`<div id="questionText" class="q">${esc(q.text)}</div><div class="opts">${q.options.map((o,i)=>`<div class="opt">${'ABCD'[i]} · ${esc(o)}</div>`).join('')}</div>${reveal?`<div class="reveal">✓ Richtige Antwort: ${esc(q.options[q.correct])}</div>`:''}<div class="hint">${reveal?'Besprechung der Lösung':'Bitte Antwortkarte hochhalten.'}</div>`;
}
setInterval(render,300);render();
document.getElementById('full').onclick=async()=>{try{await document.documentElement.requestFullscreen()}catch(e){}};
document.getElementById('hide').onclick=()=>{document.querySelector('.controls').classList.add('hidden');setTimeout(()=>document.querySelector('.controls').classList.remove('hidden'),3000)};
document.addEventListener('dblclick',async()=>{try{await document.documentElement.requestFullscreen()}catch(e){}});
</script></body></html>
