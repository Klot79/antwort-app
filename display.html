<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antwort! – AirPlay Display</title>
<style>
:root{--bg:#0f1726;--card:#1a273b;--muted:#aeb8c9;--blue:#2589ef}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a3b59,#0f1726 65%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;padding:22px clamp(18px,4vw,65px);display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:12px}.logo{font-size:30px;font-weight:950}.spacer{flex:1}.count{background:#26344b;border-radius:14px;padding:11px 15px;font-weight:950}.main{max-width:1550px;width:100%;margin:auto}.phase{font-size:14px;letter-spacing:.14em;color:var(--muted);font-weight:950;margin-bottom:10px}.q{font-size:clamp(40px,5.7vw,88px);line-height:1.06;font-weight:950;overflow-wrap:anywhere;margin-bottom:28px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.opt{background:var(--card);border:2px solid #ffffff12;border-radius:22px;padding:20px;min-height:110px;display:flex;gap:15px;font-size:clamp(24px,2.7vw,42px);font-weight:850}.letter{min-width:50px;height:50px;border-radius:14px;background:#29364c;display:grid;place-items:center}.result{font-size:clamp(50px,8vw,110px);font-weight:950}.sub{font-size:24px;color:var(--muted);font-weight:800;margin-top:10px}.barrow{display:grid;grid-template-columns:minmax(150px,340px) 1fr 70px;gap:12px;align-items:center;margin:14px 0;font-size:20px;font-weight:850}.bar{height:25px;background:#29364c;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue)}@media(max-width:750px){.opts{grid-template-columns:1fr}.barrow{grid-template-columns:95px 1fr 45px;font-size:14px}}
</style></head>
<body><div class="wrap"><div class="head"><div class="logo">Antwort!</div><div class="spacer"></div><div class="count">📷 Karten gescannt: <span id="count">0</span></div></div><main id="main" class="main"></main></div>
<script>
const KEY='antwort-v4-state',$=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function render(){let s=get(),q=s?.questions?.find(x=>x.id===s.currentQuestion),a=Object.values(s?.answers||{});$('count').textContent=a.length;if(!s||!q){$('main').innerHTML='<div class="result">Bereit? 🎓</div><div class="sub">Der Lehrer startet das Spiel.</div>';return}if(s.phase==='results'){let good=a.filter(x=>x.correct).length,total=a.length;$('main').innerHTML='<div class="phase">ERGEBNIS · FRAGE '+((s.currentIndex??0)+1)+'</div><div class="result">'+good+' / '+total+' richtig</div><div class="sub">Nächste Frage folgt.</div><div style="margin-top:25px">'+q.options.map((o,i)=>{let n=a.filter(x=>x.answer===i).length,p=total?Math.round(n/total*100):0;return '<div class="barrow"><div>'+('ABCD'[i])+' · '+esc(o)+'</div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div><div>'+n+'</div></div>'}).join('')+'</div>';return}if(s.phase==='finished'){$('main').innerHTML='<div class="result">Geschafft! 🎉</div><div class="sub">Das Spiel ist beendet.</div>';return}if(s.phase==='idle'){$('main').innerHTML='<div class="result">Bereit für Frage '+((s.currentIndex??0)+1)+'</div><div class="sub">Der Lehrer drückt Start.</div>';return}$('main').innerHTML='<div class="phase">FRAGE '+((s.currentIndex??0)+1)+' / '+s.questions.length+'</div><div class="q">'+esc(q.text)+'</div><div class="opts">'+q.options.map((o,i)=>'<div class="opt"><div class="letter">'+('ABCD'[i])+'</div><div>'+esc(o)+'</div></div>').join('')+'</div><div class="sub">Der Lehrer scannt die Karten · bereits erkannt: '+a.length+'</div>}render();window.addEventListener('storage',e=>{if(e.key===KEY)render()});try{new BroadcastChannel('antwort-v4').onmessage=render}catch(e){}
</script></body></html>
