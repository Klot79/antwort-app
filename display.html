<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antwort! – AirPlay Display</title>
<style>
:root{--bg:#0f1726;--card:#1a273b;--muted:#aeb8c9;--blue:#2589ef}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a3b59,#0f1726 65%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;padding:22px clamp(18px,4vw,65px);display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:12px}.logo{font-size:30px;font-weight:950}.spacer{flex:1}.count{background:#26344b;border-radius:14px;padding:11px 15px;font-weight:950}.main{max-width:1550px;width:100%;margin:auto}.phase{font-size:14px;letter-spacing:.14em;color:var(--muted);font-weight:950;margin-bottom:10px}.q{font-size:clamp(40px,5.7vw,88px);line-height:1.06;font-weight:950;overflow-wrap:anywhere;margin-bottom:28px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.opt{background:var(--card);border:2px solid #ffffff12;border-radius:22px;padding:20px;min-height:110px;display:flex;gap:15px;font-size:clamp(24px,2.7vw,42px);font-weight:850}.letter{min-width:50px;height:50px;border-radius:14px;background:#29364c;display:grid;place-items:center}.result{font-size:clamp(50px,8vw,110px);font-weight:950}.sub{font-size:24px;color:var(--muted);font-weight:800;margin-top:10px}.barrow{display:grid;grid-template-columns:minmax(150px,340px) 1fr 70px;gap:12px;align-items:center;margin:14px 0;font-size:20px;font-weight:850}.bar{height:25px;background:#29364c;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue)}
.fixedqr{position:fixed;left:22px;bottom:18px;background:#fff;color:#111;border-radius:16px;padding:10px 10px 8px;box-shadow:0 12px 40px #0006;text-align:center;z-index:30}.fixedqr #qr{width:118px;height:118px}.fixedqr .qrlabel{font-size:13px;font-weight:950;margin-top:5px;line-height:1.15}.fixedqr .qrsub{font-size:11px;font-weight:800;color:#555;margin-top:3px}@media(max-width:750px){.opts{grid-template-columns:1fr}.fixedqr{left:10px;bottom:10px;transform:scale(.85);transform-origin:bottom left}.barrow{grid-template-columns:95px 1fr 45px;font-size:14px}}
</style></head>
<body>
<div class="wrap"><div class="head"><div class="logo">Antwort!</div><div class="spacer"></div><div class="count">📷 Karten gescannt: <span id="count">0</span></div></div><main id="main" class="main"></main></div>
<div class="fixedqr"><div id="qr"></div><div class="qrlabel">📱 iPhone hier scannen</div><div class="qrsub">Danach Kinderkarten scannen</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const KEY='antwort-v4-state';
const FIXED_ROOM='K7P3Q';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function renderQR(){const u=new URL('scan.html',location.href);u.searchParams.set('raum',FIXED_ROOM);$('qr').innerHTML='';new QRCode($('qr'),{text:u.toString(),width:118,height:118,correctLevel:QRCode.CorrectLevel.M});}
function render(){
 const s=get();
 const q=s?.questions?.find(x=>x.id===s.currentQuestion);
 const answers=Object.values(s?.answers||{});
 $('count').textContent=answers.length;
 if(!s||!q){$('main').innerHTML='<div class="result">Bereit? 🎓</div><div class="sub">Der Lehrer startet das Spiel.</div>';return;}
 if(s.phase==='results'){
   const good=answers.filter(x=>x.correct).length,total=answers.length;
   const bars=q.options.map((o,i)=>{const n=answers.filter(x=>x.answer===i).length;const pct=total?Math.round(n/total*100):0;return `<div class="barrow"><div>${'ABCD'[i]} · ${esc(o)}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div>${n}</div></div>`}).join('');
   $('main').innerHTML=`<div class="phase">ERGEBNIS · FRAGE ${(s.currentIndex??0)+1}</div><div class="result">${good} / ${total} richtig</div><div class="sub">Nächste Frage folgt.</div><div style="margin-top:25px">${bars}</div>`;
   return;
 }
 if(s.phase==='finished'){$('main').innerHTML='<div class="result">Geschafft! 🎉</div><div class="sub">Das Spiel ist beendet.</div>';return;}
 if(s.phase==='idle'){$('main').innerHTML=`<div class="result">Bereit für Frage ${(s.currentIndex??0)+1}</div><div class="sub">Der Lehrer drückt Start.</div>`;return;}
 const opts=q.options.map((o,i)=>`<div class="opt"><div class="letter">${'ABCD'[i]}</div><div>${esc(o)}</div></div>`).join('');
 $('main').innerHTML=`<div class="phase">FRAGE ${(s.currentIndex??0)+1} / ${s.questions.length}</div><div class="q">${esc(q.text)}</div><div class="opts">${opts}</div><div class="sub">Der Lehrer scannt die Karten · bereits erkannt: ${answers.length}</div>`;
}
renderQR();render();
window.addEventListener('storage',e=>{if(e.key===KEY)render()});
try{new BroadcastChannel('antwort-v4').onmessage=render}catch(e){}
setInterval(render,1000);
</script></body></html>
