<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antwort! – Display</title>
<style>
:root{--bg:#f7faff;--ink:#17233d;--muted:#61708a;--blue:#126be4;--a:#ffd8d2;--b:#d9f5df;--c:#fff0b4;--d:#e4dcff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfdff,#edf3fa);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;padding:24px clamp(20px,4vw,65px);display:flex;flex-direction:column}.head{display:flex;align-items:center;border-bottom:1px solid #dbe4f0;padding-bottom:16px}.logo{font-size:clamp(28px,3vw,45px);font-weight:950}.spacer{flex:1}.counter{font-size:clamp(16px,1.6vw,23px);font-weight:900;background:#fff;border:1px solid #dbe4f0;border-radius:16px;padding:11px 16px}.main{width:100%;max-width:1600px;margin:auto;padding:28px 0}.phase{text-align:center;color:#61708a;font-size:clamp(15px,1.4vw,22px);font-weight:950;letter-spacing:.14em;margin-bottom:15px}.question{color:var(--blue);font-size:clamp(39px,5.2vw,82px);line-height:1.06;text-align:center;font-weight:950;max-width:1500px;margin:0 auto 34px;overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:1fr 1fr;gap:22px}.answer{border:3px solid #fff;border-radius:26px;min-height:165px;padding:26px 30px;display:flex;align-items:flex-start;gap:20px;font-size:clamp(25px,2.7vw,44px);line-height:1.14;font-weight:850;box-shadow:0 10px 26px rgba(36,59,90,.12)}.answer.a{background:var(--a)}.answer.b{background:var(--b)}.answer.c{background:var(--c)}.answer.d{background:var(--d)}.letter{flex:0 0 60px;height:60px;border-radius:16px;background:#ffffffb8;display:grid;place-items:center;font-size:clamp(25px,2.5vw,39px);font-weight:950;box-shadow:inset 0 0 0 2px #fff8}.answerText{padding-top:4px;overflow-wrap:anywhere}.hint{text-align:center;color:var(--muted);font-size:clamp(17px,1.7vw,25px);font-weight:800;margin-top:22px}.result{text-align:center;font-size:clamp(50px,8vw,110px);font-weight:950;color:#26385b}.bars{max-width:1350px;margin:28px auto}.barrow{display:grid;grid-template-columns:minmax(230px,1.5fr) 2fr 65px;gap:15px;align-items:center;margin:14px 0;font-size:clamp(16px,1.6vw,23px);font-weight:850}.bar{height:30px;background:#dfe7f2;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue)}@media(max-width:850px){.answers{grid-template-columns:1fr}.answer{min-height:120px}.barrow{grid-template-columns:130px 1fr 40px;font-size:14px}}
</style></head><body><div class="wrap"><div class="head"><div class="logo">Antwort!</div><div class="spacer"></div><div class="counter">📷 <span id="count">0</span> Antworten</div></div><main id="main" class="main"></main></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const KEY='antwort-v4-state',$=id=>document.getElementById(id);let remoteState=null,peer=null,conn=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function get(){if(remoteState)return remoteState;try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function render(){const s=get(),q=s?.questions?.find(x=>x.id===s.currentQuestion),a=Object.values(s?.answers||{});$('count').textContent=a.length;if(!s||!q){$('main').innerHTML='<div class="result">Bereit für den Unterricht 🎓</div><div class="hint">Die Lehrkraft startet die erste Frage.</div>';return}if(s.phase==='results'){const total=a.length,good=a.filter(x=>x.correct).length;const bars=q.options.map((o,i)=>{const n=a.filter(x=>x.answer===i).length,p=total?Math.round(n/total*100):0;return `<div class="barrow"><div>${'ABCD'[i]} · ${esc(o)}</div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div>${n}</div></div>`}).join('');$('main').innerHTML=`<div class="phase">ERGEBNIS · FRAGE ${(s.currentIndex??0)+1}</div><div class="result">${good} / ${total} richtig</div><div class="bars">${bars}</div>`;return}if(s.phase==='finished'){$('main').innerHTML='<div class="result">Geschafft! 🎉</div><div class="hint">Die Unterrichtsrunde ist beendet.</div>';return}if(s.phase==='idle'){$('main').innerHTML=`<div class="phase">FRAGE ${(s.currentIndex??0)+1} / ${s.questions.length}</div><div class="result">Bereit?</div><div class="hint">Die Lehrkraft startet die Frage.</div>`;return}const answers=q.options.map((o,i)=>`<div class="answer ${'abcd'[i]}"><div class="letter">${'ABCD'[i]}</div><div class="answerText">${esc(o)}</div></div>`).join('');$('main').innerHTML=`<div class="phase">FRAGE ${(s.currentIndex??0)+1} / ${s.questions.length}</div><div class="question">${esc(q.text)}</div><div class="answers">${answers}</div><div class="hint">Karte drehen · Antwort A, B, C oder D zeigen</div>`}
function connectDisplay(){const params=new URLSearchParams(location.search),room=(params.get('room')||'').toUpperCase();if(!room){render();return}peer=new Peer({debug:0});peer.on('open',()=>{conn=peer.connect('antwort-A'+room,{reliable:true});conn.on('open',()=>{conn.send({type:'hello',role:'display'});$('main').dataset.connected='1'});conn.on('data',msg=>{if(msg?.type==='state'){remoteState=msg.state;render()}});conn.on('close',()=>{remoteState=null;render()})});peer.on('error',()=>render())}
connectDisplay();render();setInterval(render,700);
</script></body></html>
