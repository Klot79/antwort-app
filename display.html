<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antwort! – Display</title><style>
:root{--bg:#101827;--card:#1b273b;--white:#fff;--muted:#aeb8c9;--g:#19b979;--p:#7854f6;--b:#278df0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a3b59,#101827 60%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{min-height:100vh;padding:24px clamp(16px,4vw,65px);display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:12px}.logo{font-size:28px;font-weight:950}.spacer{flex:1}.count{background:#26344b;border:1px solid #ffffff18;border-radius:14px;padding:10px 15px;font-weight:950}.content{flex:1;max-width:1550px;width:100%;margin:auto;display:flex;flex-direction:column;justify-content:center}.phase{font-size:14px;letter-spacing:.14em;color:var(--muted);font-weight:950;margin-bottom:12px}.question{font-size:clamp(36px,5.2vw,78px);line-height:1.08;font-weight:950;overflow-wrap:anywhere;white-space:normal;margin-bottom:28px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:16px}.answer{background:var(--card);border:2px solid #ffffff12;border-radius:22px;padding:20px;min-height:105px;display:flex;gap:15px;align-items:flex-start;font-size:clamp(22px,2.5vw,38px);font-weight:850}.letter{min-width:48px;height:48px;border-radius:14px;background:#29364c;display:grid;place-items:center;font-weight:950}.results-title{font-size:clamp(34px,5.5vw,70px);font-weight:950;margin-bottom:22px}.bars{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:minmax(140px,270px) 1fr 70px;align-items:center;gap:12px;font-weight:850;font-size:20px}.bar{height:23px;background:#29364c;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b);border-radius:99px}.finished{text-align:center}.finished h1{font-size:clamp(45px,8vw,95px);margin:0}.hint{color:var(--muted)}.controls{position:fixed;right:20px;bottom:18px;display:flex;gap:9px}.controls button{border:0;border-radius:14px;color:#fff;padding:14px 18px;font-weight:950;font-size:18px}.start{background:var(--g)}.next{background:var(--p)}.skip{background:#465269}.controls button:disabled{opacity:.35;cursor:not-allowed}@media(max-width:750px){.wrap{padding:15px}.answers{grid-template-columns:1fr}.answer{min-height:80px}.controls{left:10px;right:10px;bottom:10px}.controls button{flex:1;padding:12px 7px}.barrow{grid-template-columns:95px 1fr 50px;font-size:14px}}
</style></head><body><div class="wrap"><div class="head"><div class="logo">Antwort!</div><div class="spacer"></div><div class="count">📷 Karten gescannt: <span id="count">0</span></div></div><main id="content" class="content"></main><div class="controls"><button class="start" id="start">▶ Start</button><button class="next" id="next">Weiter →</button><button class="skip" id="skip">Überspringen</button></div></div><script>
const KEY='antwort-v4-state',$=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function q(s){return s?.questions?.find(x=>x.id===s.currentQuestion)}function render(){let s=get(),qq=q(s),a=s?.answers||{};$('count').textContent=Object.keys(a).length;let c=$('content');if(!s||!s.questions?.length){c.innerHTML='<div class="finished"><h1>Bereit?</h1><div class="hint">Im Administratorbereich Fragen anlegen.</div></div>';syncButtons();return}if(s.phase==='results'){let v=Object.values(a),total=v.length,good=v.filter(x=>x.correct).length;c.innerHTML=`<div class="phase">GESAMTERGEBNIS · FRAGE ${(s.currentIndex??0)+1}</div><div class="results-title">${good} von ${total} Antworten richtig</div><div class="bars">${qq.options.map((o,i)=>{let n=v.filter(x=>x.answer===i).length,p=total?Math.round(n/total*100):0;return `<div class="barrow"><div>${'ABCD'[i]} · ${esc(o)}</div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div>${n}</div></div>`}).join('')}</div>`;syncButtons();return}if(s.phase==='finished'){c.innerHTML='<div class="finished"><h1>Spiel beendet 🎉</h1><div class="hint">Alle Fragen sind gespielt.</div></div>';syncButtons();return}c.innerHTML=`<div class="phase">FRAGE ${(s.currentIndex??0)+1} / ${s.questions.length}</div><div class="question">${esc(qq?.text||'')}</div><div class="answers">${(qq?.options||[]).map((o,i)=>`<div class="answer"><div class="letter">${'ABCD'[i]}</div><div>${esc(o)}</div></div>`).join('')}</div>`;syncButtons()}function syncButtons(){let s=get(),phase=s?.phase;$('start').disabled=phase==='question'||phase==='results'||phase==='finished';$('next').disabled=phase!=='question'&&phase!=='results';$('skip').disabled=phase!=='question'}function nextQuestion(s){let n=(s.currentIndex??0)+1;if(n>=s.questions.length){s.phase='finished';return}s.currentIndex=n;s.currentQuestion=s.questions[n].id;s.answers={};s.phase='question'}$('start').onclick=()=>{let s=get();if(!s?.questions?.length)return;if(s.phase==='results'){nextQuestion(s)}else{let i=s.currentIndex>=0?s.currentIndex:0;s.currentIndex=i;s.currentQuestion=s.questions[i].id;s.answers={};s.phase='question'}save(s);render()};$('next').onclick=()=>{let s=get();if(!s)return;if(s.phase==='question'){let qq=q(s),v=Object.values(s.answers||{});s.history=s.history||[];s.history.push({questionId:qq.id,total:v.length,correct:v.filter(x=>x.correct).length,rows:v.map(x=>({id:x.id,answer:x.answer,correct:x.correct}))});s.phase='results';save(s);render()}else if(s.phase==='results'){nextQuestion(s);save(s);render()}};$('skip').onclick=()=>{let s=get();if(!s||s.phase!=='question')return;nextQuestion(s);save(s);render()};window.addEventListener('storage',render);setInterval(render,500);render();
</script></body></html>
